[project]
name = "saka"
version = "0.1.0"
description = "Podcast transcriptlerinde anlam bazlı arama yapan bir arama motoru"
readme = "README.md"
authors = [
    { name = "tahaasann", email = "tahaasann@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
saka = "saka:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
